<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jamin Properties — Admin Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --brand:#E11B22; --brand-dark:#B8151B; --brand-soft:#FCECEC;
    --gold:#E0A423; --gold-soft:#FBF3DE; --gold-dark:#9C7D1A;
    --navy:#141A2E; --navy2:#1E2740; --success:#14A05A; --success-soft:#E7F5EE;
    --ink:#14151A; --ink-soft:#565863; --ink-faint:#8E9099;
    --surface:#fff; --canvas:#F4F5F8; --sunken:#ECEDF1; --hair:#E7E8EE;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Inter",system-ui,sans-serif;background:var(--canvas);color:var(--ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;}
  a{color:var(--brand);text-decoration:none;}
  button{font-family:inherit;cursor:pointer;border:none;}
  input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);width:100%;background:#fff;border:1px solid var(--hair);border-radius:10px;padding:10px 12px;outline:none;}
  input:focus,select,textarea:focus{border-color:var(--brand);}
  textarea{min-height:80px;resize:vertical;}
  label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin:12px 0 6px;}
  .btn{background:var(--brand);color:#fff;font-weight:600;font-size:14px;padding:11px 18px;border-radius:11px;box-shadow:0 8px 18px -8px rgba(225,27,34,.5);}
  .btn:hover{background:var(--brand-dark);}
  .btn.gold{background:var(--gold);color:var(--navy);box-shadow:none;} .btn.gold:hover{background:var(--gold-dark);color:#fff;}
  .btn.ghost{background:#fff;color:var(--brand);border:1.5px solid var(--brand);box-shadow:none;}
  .btn.ink{background:var(--navy);box-shadow:none;} .btn.sm{padding:7px 12px;font-size:12.5px;border-radius:9px;}
  .btn.grey{background:var(--sunken);color:var(--ink-soft);box-shadow:none;}
  .muted{color:var(--ink-faint);} .pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;}
  .pill.ok{background:var(--success-soft);color:var(--success);} .pill.warn{background:var(--gold-soft);color:var(--gold-dark);}
  .pill.red{background:var(--brand-soft);color:var(--brand);} .pill.grey{background:var(--sunken);color:var(--ink-faint);}
  .card{background:#fff;border:1px solid var(--hair);border-radius:16px;box-shadow:0 1px 2px rgba(20,26,46,.04),0 12px 26px -18px rgba(20,26,46,.14);}

  /* login */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(900px 500px at 80% -10%,rgba(225,27,34,.06),transparent 60%),var(--canvas);}
  #login .box{width:380px;max-width:100%;padding:34px 30px;text-align:center;}
  #login .logo{width:56px;height:56px;border-radius:17px;margin:0 auto 14px;background:linear-gradient(135deg,#F0474E,#B8151B);display:grid;place-items:center;color:#fff;font-weight:800;font-size:24px;}
  #login h1{font-size:21px;font-weight:700;margin:0 0 4px;letter-spacing:-.02em;} #login p{margin:0 0 20px;font-size:13px;}

  /* shell */
  #app{display:none;grid-template-columns:236px 1fr;min-height:100vh;}
  aside{background:var(--navy);color:#fff;padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto;}
  aside .brand{display:flex;align-items:center;gap:10px;margin-bottom:24px;}
  aside .brand .l{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#F0474E,#B8151B);display:grid;place-items:center;font-weight:800;}
  aside .brand b{font-size:15px;font-weight:700;} aside .brand span{display:block;font-size:10px;color:rgba(255,255,255,.55);}
  nav a{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:11px;color:rgba(255,255,255,.72);font-size:14px;font-weight:500;margin-bottom:3px;}
  nav a:hover{background:rgba(255,255,255,.06);color:#fff;} nav a.on{background:var(--brand);color:#fff;}
  nav a .badge{margin-left:auto;background:var(--gold);color:var(--navy);font-size:11px;font-weight:800;border-radius:999px;padding:1px 8px;}
  main{padding:26px 34px;max-width:1200px;}
  header.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
  header.top h2{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:0;}
  .who{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink-soft);}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
  .stat{padding:16px 18px;} .stat .n{font-size:26px;font-weight:700;letter-spacing:-.02em;} .stat .l{font-size:12px;color:var(--ink-faint);margin-top:2px;}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
  .toolbar input,.toolbar select{width:auto;} .toolbar .grow{flex:1;min-width:180px;}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;border:1px solid var(--hair);}
  th{background:var(--sunken);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);padding:11px 14px;}
  td{padding:12px 14px;border-top:1px solid var(--hair);font-size:13.5px;vertical-align:middle;}
  tr.click:hover{background:#faf9fb;cursor:pointer;}
  .thumb{width:48px;height:40px;border-radius:8px;object-fit:cover;background:var(--sunken);}

  /* drawer */
  .drawer-bg{position:fixed;inset:0;background:rgba(20,26,46,.4);display:none;z-index:40;}
  .drawer{position:fixed;top:0;right:0;height:100vh;width:640px;max-width:96vw;background:var(--canvas);box-shadow:-20px 0 50px -20px rgba(0,0,0,.4);transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.7,.2,1);overflow:auto;z-index:41;}
  .drawer.open{transform:translateX(0);} .drawer-bg.open{display:block;}
  .drawer .dh{position:sticky;top:0;background:var(--canvas);display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--hair);z-index:2;}
  .drawer .dh h3{margin:0;font-size:18px;font-weight:700;flex:1;} .drawer .body{padding:20px 22px 40px;}
  .sec{background:#fff;border:1px solid var(--hair);border-radius:14px;padding:16px;margin-bottom:14px;}
  .sec h4{margin:0 0 10px;font-size:14px;font-weight:700;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;} .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px;}
  .chips{display:flex;flex-wrap:wrap;gap:7px;} .chip{padding:8px 12px;border-radius:999px;border:1px solid var(--hair);background:#fff;font-size:12.5px;font-weight:600;color:var(--ink-soft);}
  .chip.on{background:var(--brand);border-color:var(--brand);color:#fff;} .chip.g.on{background:var(--success);border-color:var(--success);}
  .switch{display:flex;align-items:center;justify-content:space-between;padding:6px 0;font-size:14px;font-weight:500;}
  .tgl{width:44px;height:26px;border-radius:13px;background:var(--sunken);position:relative;transition:.2s;flex:none;}
  .tgl.on{background:var(--brand);} .tgl b{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;} .tgl.on b{left:21px;}
  .media-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .mtile{border:1px solid var(--hair);border-radius:12px;overflow:hidden;background:#fff;}
  .mtile img{width:100%;height:96px;object-fit:cover;display:block;background:var(--sunken);}
  .mtile .mt-b{padding:8px;display:flex;gap:6px;align-items:center;justify-content:space-between;}
  .mtile .star{color:var(--gold);font-weight:800;font-size:12px;}
  .iconbtn{width:28px;height:28px;border-radius:8px;background:var(--sunken);display:grid;place-items:center;font-size:13px;color:var(--ink-soft);}
  .docrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--hair);}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;font-weight:500;z-index:80;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);opacity:0;transition:.25s;}
  .toast.show{opacity:1;}
  .empty{padding:40px;text-align:center;color:var(--ink-faint);font-size:13px;}
  @media (max-width:820px){ #app{grid-template-columns:1fr;} aside{position:static;height:auto;} }
</style>
</head>
<body>

<!-- ───────── LOGIN ───────── -->
<div id="login">
  <div class="box card">
    <div class="logo">J</div>
    <h1>Jamin Admin Console</h1>
    <p class="muted">Sign in with your registered mobile number.</p>
    <div id="step-mobile">
      <input id="mobile" type="tel" placeholder="Mobile number" autocomplete="tel" style="text-align:center;font-size:16px;" />
      <button class="btn" style="width:100%;margin-top:12px;" onclick="sendOtp()">Send OTP</button>
    </div>
    <div id="step-otp" style="display:none;">
      <input id="otp" inputmode="numeric" placeholder="6-digit code" style="text-align:center;font-size:20px;letter-spacing:6px;" />
      <button class="btn" style="width:100%;margin-top:12px;" onclick="verifyOtp()">Verify & sign in</button>
      <button class="btn grey" style="width:100%;margin-top:8px;" onclick="resetLogin()">Change number</button>
    </div>
    <div id="login-msg" class="muted" style="margin-top:14px;font-size:12.5px;min-height:18px;"></div>
  </div>
</div>

<!-- ───────── APP ───────── -->
<div id="app">
  <aside>
    <div class="brand"><div class="l">J</div><div><b>Jamin Admin</b><span>Property console</span></div></div>
    <nav id="nav">
      <a data-view="dashboard" class="on">◱ Dashboard</a>
      <a data-view="properties">▤ Properties</a>
      <a data-view="kyc">🛡 KYC <span class="badge" id="b-kyc" style="display:none"></span></a>
      <a data-view="partners">🎗 Partners <span class="badge" id="b-partner" style="display:none"></span></a>
      <a data-view="tree">🌳 Promoter Tree</a>
      <a data-view="earnings">💰 Earnings</a>
      <a data-view="subs">📥 Submissions <span class="badge" id="b-subs" style="display:none"></span></a>
      <a data-view="visits">🗓 Visits <span class="badge" id="b-visits" style="display:none"></span></a>
      <a data-view="leads">📇 Leads</a>
      <a data-view="invites">💬 Invites <span class="badge" id="b-inv" style="display:none"></span></a>
      <a data-view="community">🗣 Community <span class="badge" id="b-comm" style="display:none"></span></a>
      <a data-view="users">👥 Users</a>
      <a data-view="share">📣 Share & Brochures</a>
    </nav>
  </aside>
  <main>
    <header class="top">
      <h2 id="view-title">Dashboard</h2>
      <div class="who"><span id="who-name" class="muted"></span><button class="btn grey sm" onclick="signOut()">Sign out</button></div>
    </header>
    <div id="view"></div>
  </main>
</div>

<div class="drawer-bg" id="drawer-bg" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer"></div>
<div class="toast" id="toast"></div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL = "https://zmxqozvivdluuxvvcegs.supabase.co";
const ANON = "sb_publishable_7Oe-H5Ekn7FaS9c0pVbrVQ_ph9LHHsS";
const sb = createClient(SUPABASE_URL, ANON);
window.sb = sb;

const $ = (s) => document.querySelector(s);
const esc = (s) => (s==null?"":String(s)).replace(/[&<>"]/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const inr = (n) => n==null?"—":"₹"+Number(n).toLocaleString("en-IN");
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200);}
window.toast = toast;

// ───────── auth (mobile OTP, same as the app) ─────────
let loginMobile = "";
window.sendOtp = async () => {
  const m = $("#mobile").value.replace(/[^0-9]/g,"");
  if(m.length<10){ $("#login-msg").textContent="Enter a valid mobile number."; return; }
  loginMobile = m; $("#login-msg").textContent="Sending OTP…";
  try{
    const r = await fetch(`${SUPABASE_URL}/functions/v1/send-otp`,{method:"POST",headers:{"Content-Type":"application/json",apikey:ANON,Authorization:`Bearer ${ANON}`},body:JSON.stringify({mobile:m})});
    const j = await r.json(); if(!r.ok) throw new Error(j.error||"Failed");
    $("#step-mobile").style.display="none"; $("#step-otp").style.display="block";
    $("#login-msg").textContent = j.delivered ? "OTP sent on WhatsApp." : (j.devCode? "Dev code: "+j.devCode : "OTP sent.");
    if(j.devCode) $("#otp").value=j.devCode;
  }catch(e){ $("#login-msg").textContent=e.message; }
};
window.verifyOtp = async () => {
  const code = $("#otp").value.replace(/[^0-9]/g,"");
  $("#login-msg").textContent="Verifying…";
  try{
    const r = await fetch(`${SUPABASE_URL}/functions/v1/verify-otp`,{method:"POST",headers:{"Content-Type":"application/json",apikey:ANON,Authorization:`Bearer ${ANON}`},body:JSON.stringify({mobile:loginMobile,code})});
    const j = await r.json(); if(!r.ok) throw new Error(j.error||"Invalid code");
    const { error } = await sb.auth.signInWithPassword({ email:j.email, password:j.password });
    if(error) throw error;
    await boot();
  }catch(e){ $("#login-msg").textContent=e.message; }
};
window.resetLogin = () => { $("#step-otp").style.display="none"; $("#step-mobile").style.display="block"; $("#login-msg").textContent=""; };
window.signOut = async () => { await sb.auth.signOut(); location.reload(); };

let ME = null;
async function boot(){
  const { data:{ user } } = await sb.auth.getUser();
  if(!user){ return; }
  const { data:prof } = await sb.from("profiles").select("*").eq("id",user.id).maybeSingle();
  if(!prof || prof.role!=="super_admin"){ $("#login-msg").textContent="This console is for administrators only."; await sb.auth.signOut(); return; }
  ME = prof;
  $("#login").style.display="none"; $("#app").style.display="grid";
  $("#who-name").textContent = (prof.full_name||"Admin")+" · "+(prof.member_code||"");
  document.querySelectorAll("#nav a").forEach(a=>a.onclick=()=>go(a.dataset.view));
  refreshBadges(); go("dashboard");
}
sb.auth.getSession().then(({data})=>{ if(data.session) boot(); });

async function refreshBadges(){
  const [{count:k},{count:p},{count:s},{count:vv},{count:iv},{count:cr}] = await Promise.all([
    sb.from("kyc_submissions").select("id",{count:"exact",head:true}).eq("status","pending"),
    sb.from("profiles").select("id",{count:"exact",head:true}).eq("partner_status","pending"),
    sb.from("property_submissions").select("id",{count:"exact",head:true}).eq("status","submitted"),
    sb.from("site_visits").select("id",{count:"exact",head:true}).eq("status","requested"),
    sb.from("referral_wa_requests").select("id",{count:"exact",head:true}).eq("status","new").then(r=>r.error?{count:0}:r),
    sb.from("community_reports").select("id",{count:"exact",head:true}).eq("status","open").then(r=>r.error?{count:0}:r),
  ]);
  const bk=$("#b-kyc"), bp=$("#b-partner"), bs=$("#b-subs"), bv=$("#b-visits"), bi=$("#b-inv"), bc=$("#b-comm");
  if(k){bk.style.display="inline-block";bk.textContent=k;} else bk.style.display="none";
  if(p){bp.style.display="inline-block";bp.textContent=p;} else bp.style.display="none";
  if(s){bs.style.display="inline-block";bs.textContent=s;} else bs.style.display="none";
  if(vv){bv.style.display="inline-block";bv.textContent=vv;} else bv.style.display="none";
  if(iv){bi.style.display="inline-block";bi.textContent=iv;} else bi.style.display="none";
  if(cr){bc.style.display="inline-block";bc.textContent=cr;} else bc.style.display="none";
}

// ───────── router ─────────
const TITLES={dashboard:"Dashboard",properties:"Properties",kyc:"KYC Verifications",partners:"Partner Requests",tree:"Promoter Tree",earnings:"Earnings & Commissions",subs:"Property Submissions",visits:"Site Visits",leads:"Leads",invites:"WhatsApp Invites",community:"Community",registrations:"Registration Details",users:"Users",share:"Share & Brochures"};
function go(v){
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.view===v));
  $("#view-title").textContent=TITLES[v]; $("#view").innerHTML="<div class='empty'>Loading…</div>";
  ({dashboard:renderDashboard,properties:renderProperties,kyc:renderKyc,partners:renderPartners,tree:renderTree,earnings:renderEarnings,subs:renderSubmissions,visits:renderVisits,leads:renderLeads,invites:renderInvites,community:renderCommunity,registrations:renderRegistrations,users:renderUsers,share:renderShareSettings}[v])();
}
window.go = go;

// ───────── dashboard ─────────
async function renderDashboard(){
  const c = (t,f)=>{let q=sb.from(t).select("id",{count:"exact",head:true}); if(f)q=f(q); return q.then(r=>r.count||0);};
  const [users,buyers,promoters,props,visits,leads,kyc,partners,referred] = await Promise.all([
    c("profiles"),c("profiles",q=>q.eq("role","buyer")),c("profiles",q=>q.eq("role","promoter")),
    c("properties"),c("site_visits"),c("leads"),c("kyc_submissions",q=>q.eq("status","pending")),c("profiles",q=>q.eq("partner_status","pending")),
    c("profiles",q=>q.not("referred_by","is",null)),
  ]);
  const stat=(n,l,col,click)=>`<div class="stat card"${click?` style="cursor:pointer" onclick="${click}" title="Open ${l}"`:''}><div class="n" style="color:${col||'var(--ink)'}">${n}</div><div class="l">${l}</div></div>`;
  $("#view").innerHTML = `<div class="stats">
    ${stat(users,"Total users",null,"go('registrations')")}${stat(buyers,"Buyers","var(--gold-dark)","go('registrations')")}${stat(promoters,"Promoters","#4B57C9","go('registrations')")}${stat(props,"Properties","var(--success)")}
    ${stat(visits,"Site visits","#2B6FE1")}${stat(leads,"Leads","var(--brand)")}${stat(kyc,"KYC pending","var(--gold-dark)")}${stat(partners,"Partner pending","var(--gold-dark)")}${stat(referred,"Referred signups","var(--success)","go('users')")}
  </div>
  <div class="card" style="padding:20px;"><b>Welcome back, ${esc(ME.full_name||"Admin")}.</b>
  <p class="muted" style="font-size:13px;margin:8px 0 0;">Manage listings from <a onclick="go('properties')">Properties</a>, review <a onclick="go('kyc')">KYC</a> and <a onclick="go('partners')">Partner</a> requests. Everything here shares the live backend with the mobile app — changes sync instantly.</p></div>`;
}

// ───────── properties ─────────
async function renderProperties(){
  $("#view").innerHTML = `<div class="toolbar">
    <input class="grow" id="p-search" placeholder="Search title, city, locality…" />
    <select id="p-status"><option value="">All statuses</option><option>draft</option><option>available</option><option>reserved</option><option>sold</option><option>archived</option></select>
    <button class="btn" onclick="openProperty()">+ New property</button>
  </div><div id="p-list"><div class="empty">Loading…</div></div>`;
  $("#p-search").oninput = debounce(loadProps,300); $("#p-status").onchange = loadProps;
  loadProps();
}
function debounce(f,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),ms);};}
async function loadProps(){
  const term=$("#p-search").value.trim(), st=$("#p-status").value;
  let q=sb.from("properties").select("*").order("created_at",{ascending:false}).limit(300);
  if(st) q=q.eq("status",st);
  const { data } = await q;
  let rows = data||[];
  if(term){const t=term.toLowerCase();rows=rows.filter(p=>[p.title,p.city,p.locality,p.district].some(x=>(x||"").toLowerCase().includes(t)));}
  const tone={draft:"grey",available:"ok",reserved:"warn",sold:"red",archived:"grey"};
  $("#p-list").innerHTML = rows.length? `<table><thead><tr><th></th><th>Title</th><th>Location</th><th>Type</th><th>Price</th><th>Status</th><th></th></tr></thead><tbody>
    ${rows.map(p=>`<tr class="click" onclick="openProperty('${p.id}')">
      <td><img class="thumb" src="${esc((p.images&&p.images[0])||"")}" onerror="this.style.visibility='hidden'"/></td>
      <td><b>${esc(p.title)}</b></td><td class="muted">${esc([p.locality,p.city].filter(Boolean).join(", "))}</td>
      <td class="muted">${esc(p.property_type)}</td><td>${inr(p.price)}</td>
      <td><span class="pill ${tone[p.status]||'grey'}">${p.status}</span></td>
      <td class="muted">›</td></tr>`).join("")}</tbody></table>`
    : `<div class="empty card">No properties yet. Click “New property”.</div>`;
}

const TYPES=["residential_plot","villa_plot","apartment","house","farm_land","commercial_land","industrial_land"];
const STATUSES=["draft","available","reserved","sold","archived"];
const PHASES=["completed","current","ongoing","future"];
const APPROVALS=["dtcp","rera","cmda","panchayat","clear_title"];
let CUR=null; // current property being edited

window.openProperty = async (id)=>{
  CUR = id ? (await sb.from("properties").select("*").eq("id",id).maybeSingle()).data : { status:"draft", property_type:"residential_plot", project_phase:"current", listing_type:"sale", approvals:{}, is_featured:false };
  renderEditor();
  $("#drawer").classList.add("open"); $("#drawer-bg").classList.add("open");
};
window.closeDrawer = ()=>{ $("#drawer").classList.remove("open"); $("#drawer-bg").classList.remove("open"); };

function fld(label,key,ph="",type="text"){return `<div><label>${label}</label><input data-k="${key}" type="${type}" value="${esc(CUR[key]??"")}" placeholder="${ph}"/></div>`;}
function txt(label,key){return `<div><label>${label}</label><textarea data-k="${key}">${esc(CUR[key]??"")}</textarea></div>`;}
function chips(label,key,opts){return `<label>${label}</label><div class="chips" data-chips="${key}">${opts.map(o=>`<div class="chip ${CUR[key]===o?'on':''}" data-v="${o}">${o.replace(/_/g," ")}</div>`).join("")}</div>`;}

window.aiDescribe = async (btn)=>{
  btn.textContent="Writing…"; btn.disabled=true;
  try{
    const g=(k)=>$(`#drawer [data-k="${k}"]`)?.value||"";
    const prompt=`Write a warm, credible 60-80 word marketing description for this Indian real-estate listing. Do not invent facts. Plain text.\nType: ${g("property_type")||CUR.property_type}\nName: ${g("title")}\nLocation: ${[g("locality"),g("city"),g("state")].filter(Boolean).join(", ")}\nPrice: ₹${g("price")}\nArea: ${g("area_value")} ${g("area_unit")}\nFacing: ${g("vastu_facing")}\nAmenities: ${g("_amenities")}`;
    const { data, error } = await sb.functions.invoke("jamindar-voice",{body:{action:"chat",messages:[{role:"user",content:prompt}],userText:prompt,language:"en-IN"}});
    if(error) throw error;
    if(data?.reply) $(`#drawer [data-k="description"]`).value=data.reply;
    toast("Description generated");
  }catch(e){ toast("Couldn't generate"); } finally{ btn.textContent="✦ Generate with Jamindar AI"; btn.disabled=false; }
};

    price:num("price"), area_value:num("area_value"), area_unit:g("area_unit").trim()||"sqft", property_age:g("property_age").trim()||null,
    plots_total:num("plots_total"), plots_available:num("plots_available"), taxes:g("taxes").trim()||null, maintenance_charges:g("maintenance_charges").trim()||null,
    plot_length:num("plot_length"), plot_breadth:num("plot_breadth"), plot_dimensions:g("plot_dimensions").trim()||null,
    locality:g("locality").trim()||null, city:g("city").trim()||null, taluk:g("taluk").trim()||null, district:g("district").trim()||null, village:g("village").trim()||null,
    state:g("state").trim()||null, pincode:g("pincode").trim()||null, survey_number:g("survey_number").trim()||null, patta_khata:g("patta_khata").trim()||null,
    road_frontage:g("road_frontage").trim()||null, lat:num("lat"), lng:num("lng"), gmaps_url:g("gmaps_url").trim()||null, street_view_url:g("street_view_url").trim()||null, google_earth_url:g("google_earth_url").trim()||null,
    description:g("description").trim()||null, vastu_facing:g("vastu_facing").trim()||null, amenities:arr("_amenities"), utilities:arr("_utilities"),
    approvals, rera_number:g("rera_number").trim()||null, title_status:g("title_status").trim()||null, legal, investment, seo,
    project_name:g("project_name").trim()||null, location_text:g("location_text").trim()||null, total_project_value:num("total_project_value"),
    referral_direct_per_sqft:num("referral_direct_per_sqft"), referral_indirect_per_sqft:num("referral_indirect_per_sqft"), referral_indirect_levels:num("referral_indirect_levels"),
    nearby_defaults:(()=>{const o={};document.querySelectorAll('#drawer [data-near]').forEach(e=>o[e.dataset.near]=e.value.trim());return o;})(),
    brochure_url:g("brochure_url").trim()||null, master_plan_url:g("master_plan_url").trim()||null, virtual_tour_url:g("virtual_tour_url").trim()||null,
    loan_eligible:$(`#drawer [data-tgl="loan_eligible"]`).classList.contains("on"), loan_details:g("loan_details").trim()||null, encumbrance_status:g("encumbrance_status").trim()||null,
    plot_layout:g("_plot_layout").split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const[plot,size,facing,status]=l.split("|").map(x=>x.trim());const r={plot,status:status||"available"};if(size)r.size_sqft=Number(size)||null;if(facing)r.facing=facing;return r;}).filter(r=>r.plot),
    nearby_places:g("_nearby").split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const[name,distance,duration,category]=l.split("|").map(x=>x.trim());const r={name};if(distance)r.distance=distance;if(duration)r.duration=duration;if(category)r.category=category;return r;}).filter(r=>r.name),

// Downscale + re-encode large images before upload (max 1920px, JPEG q0.82).
async function compressImage(file){
  if(!file.type || !file.type.startsWith("image/")) return file;
  try{
    const img=await createImageBitmap(file);
    const max=1920; let w=img.width, h=img.height;
    if(w>max||h>max){ const s=max/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s); }
    const c=document.createElement("canvas"); c.width=w; c.height=h;
    c.getContext("2d").drawImage(img,0,0,w,h);
    const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.82));
    if(blob && blob.size < file.size) return new File([blob], file.name.replace(/\.\w+$/,"")+".jpg", {type:"image/jpeg"});
    return file;
  }catch(e){ return file; }
}
async function uploadFiles(files,kind){
  if(!files.length) return; toast("Uploading…");
  const existing=window._media||[]; const hasPrimary=existing.some(m=>m.kind==="image"&&m.is_primary);
  let order=existing.reduce((mx,m)=>Math.max(mx,m.sort_order),0), first=true;
  for(const raw of files){
    const f = kind==="image" ? await compressImage(raw) : raw;
    const path=`${CUR.id}/${Date.now()}_${Math.round(Math.random()*1e5)}_${f.name.replace(/[^a-z0-9.]/gi,"_")}`;
    const {error}=await sb.storage.from("property-media").upload(path,f,{contentType:f.type||"application/octet-stream",upsert:true});
    if(error){ toast(error.message); continue; }
    const url=sb.storage.from("property-media").getPublicUrl(path).data.publicUrl;
    order++; await sb.from("property_media").insert({property_id:CUR.id,kind,url,sort_order:order,is_primary:kind==="image"&&!hasPrimary&&first});
    first=false;
  }
  toast("Uploaded"); loadMedia();
}
window.mSetPrimary=async(id)=>{ await sb.from("property_media").update({is_primary:false}).eq("property_id",CUR.id).eq("kind","image"); await sb.from("property_media").update({is_primary:true}).eq("id",id); loadMedia(); };
window.mMove=async(i,dir)=>{ const ph=(window._media||[]).filter(m=>m.kind==="image"); const j=i+dir; if(j<0||j>=ph.length)return; const a=ph[i],b=ph[j]; await sb.from("property_media").update({sort_order:b.sort_order}).eq("id",a.id); await sb.from("property_media").update({sort_order:a.sort_order}).eq("id",b.id); loadMedia(); };
window.mDel=async(id)=>{ if(!confirm("Remove this item?"))return; await sb.from("property_media").delete().eq("id",id); loadMedia(); };
window.mAddLink=async()=>{ const url=$("#doc-url").value.trim(); if(!url)return; const kind=$("#doc-kind").value; const order=(window._media||[]).reduce((mx,m)=>Math.max(mx,m.sort_order),0)+1; await sb.from("property_media").insert({property_id:CUR.id,kind,url,sort_order:order}); loadMedia(); };
window.mVis=async(id,a)=>{ const m=(window._media||[]).find(x=>x.id===id); const vis=m.visibility||[]; const nv=vis.includes(a)?vis.filter(x=>x!==a):[...vis,a]; await sb.from("property_media").update({visibility:nv}).eq("id",id); loadMedia(); };

async function renderKyc(){
  // Bug 28-07 (#6): approved/rejected KYCs are visible here too and can be
  // sent back to review (accidental decisions are correctable, audited).
  const status = window.__kycFilter || "pending";
  const { data } = await sb.from("kyc_submissions").select("*, applicant:profiles!kyc_submissions_user_id_fkey(full_name,member_code,mobile)").eq("status",status).order("submitted_at",{ascending:false});
  const rows=data||[];
  const chip=(v,l)=>`<button class="btn ${status===v?'':'grey'} sm" onclick="kycFilter('${v}')">${l}</button>`;
  $("#view").innerHTML = `<div class="toolbar" style="gap:6px;flex-wrap:wrap;margin-bottom:10px">${chip('pending','Pending')}${chip('approved','Approved')}${chip('rejected','Rejected')}</div>` + (rows.length? `<table><thead><tr><th>Applicant</th><th>ID</th><th>PAN</th><th>Submitted</th><th></th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td><b>${esc(r.applicant?.full_name||"—")}</b><div class="muted" style="font-size:11px">+${esc(r.applicant?.mobile||"")}</div></td>
    <td class="muted">${esc(r.applicant?.member_code||"")}</td><td>${esc(r.pan_number||"—")}</td><td class="muted">${new Date(r.submitted_at).toLocaleDateString()}</td>
    <td style="text-align:right">${status==='pending'?`<button class="btn ghost sm" onclick='reviewKyc("${r.id}","rejected")'>Reject</button> <button class="btn sm" onclick='reviewKyc("${r.id}","approved")'>Approve</button>`:`<button class="btn grey sm" onclick='reviewKyc("${r.id}","pending")'>Send back to review</button>`}</td></tr>`).join("")}</tbody></table>`
    : `<div class="empty card">No ${esc(status)} KYC submissions.</div>`);
}
window.kycFilter=(v)=>{ window.__kycFilter=v; renderKyc(); };
window.reviewKyc = async(id,decision)=>{
  let reason=null; if(decision==="rejected"){ reason=prompt("Reason for rejection:"); if(reason===null)return; }
  if(decision==="pending" && !confirm("Send this KYC back to the Pending queue for a fresh review?")) return;
  const { error } = await sb.rpc("admin_review_kyc",{p_submission:id,p_decision:decision,p_reason:reason,p_corrections:null});
  if(error) return toast(error.message); toast(decision==="pending"?"Sent back to review":"KYC "+decision); refreshBadges(); renderKyc();
};

window.reviewPartner = async(id,decision)=>{

async function loadUsers(){
  const term=$("#u-search").value.trim().toLowerCase(), role=$("#u-role").value, act=$("#u-active").value;

  const { data } = await q; let rows=data||[];
  USERS_BY_ID={}; rows.forEach(u=>USERS_BY_ID[u.id]=u);
  // referral relationships: how many members each user brought in
  const counts={}; const { data: refRows } = await sb.from("profiles").select("id,referred_by").not("referred_by","is",null);
  (refRows||[]).forEach(r=>{ counts[r.referred_by]=(counts[r.referred_by]||0)+1; });
  if(act) rows=rows.filter(u=> act==="1" ? u.is_active!==false : u.is_active===false);
  if(term) rows=rows.filter(u=>[u.full_name,u.member_code,u.mobile].some(x=>(x||"").toLowerCase().includes(term)));
  const kt={approved:"ok",pending:"warn",rejected:"red",not_started:"grey"};
  $("#u-list").innerHTML = rows.length? `<table><thead><tr><th>ID</th><th>Name</th><th>Role</th><th>KYC</th><th>Referral</th><th>Status</th><th>Actions</th></tr></thead><tbody>

      const n=counts[u.id]||0;
      return `<tr${u.is_active===false?' style="opacity:.55"':''}><td class="muted">${esc(u.member_code||"")}</td>
      <td><b>${esc(u.full_name||"—")}</b><div class="muted" style="font-size:12px">+${esc(u.mobile||"")}${u.city?" · "+esc(u.city):""}</div></td>
      <td><span class="pill grey">${u.role}</span>${u.partner_status==="verified"?" <span class='pill ok'>partner</span>":""}</td>
      <td><span class="pill ${kt[u.kyc_status]||'grey'}">${(u.kyc_status||"").replace("_"," ")}</span></td>
      <td><div style="font-size:12px"><b>${esc(u.referral_code||"—")}</b> ${u.referral_code?`<button class="btn grey sm" style="padding:2px 8px" onclick="copyRefLink('${esc(u.referral_code)}')">Copy link</button>`:""}</div>
        <div class="muted" style="font-size:11px">${n} referred${refBy?" · "+refBy:""}</div></td>
      <td>${u.is_active===false?`<span class="pill red">deactivated</span>`:`<span class="pill ok">active</span>`}</td>
      <td style="white-space:nowrap"><button class="btn grey sm" onclick="openUserEdit('${u.id}')">Edit</button>
        ${u.role==="super_admin"?"":(u.is_active===false?`<button class="btn sm" onclick="toggleUserActive('${u.id}',true)">Activate</button>`:`<button class="btn ink sm" onclick="toggleUserActive('${u.id}',false)">Deactivate</button>`)}
      </td></tr>`;}).join("")}</tbody></table>`
    : `<div class="empty card">No users found.</div>`;
}

window.submitUserAdd=async()=>{
  const g=(k)=>$(`#drawer [data-uk="${k}"]`)?.value.trim()||"";
  const btn=$("#u-add-btn"); btn.disabled=true; btn.textContent="Creating…";
  try{

    const { data, error } = await sb.rpc("admin_registration_details",{p_limit:500});
    if(error){ $("#view").innerHTML=`<div class="empty card">${esc(error.message)}</div>`; return; }
    __regRows = data||[];
  }
  const q=__regSearch.trim().toLowerCase();
  let rows=__regRows.filter(r=>!q || (r.name||'').toLowerCase().includes(q) || (r.user_id||'').toLowerCase().includes(q) || (r.mobile||'').includes(q));
  const dir=__regSort.asc?1:-1;
  rows=[...rows].sort((a,b)=>{
    if(__regSort.key==='name') return (a.name||'').localeCompare(b.name||'')*dir;
    if(__regSort.key==='buy') return ((a.bought?1:0)-(b.bought?1:0))*dir;
    return (new Date(a.registered_at)-new Date(b.registered_at))*dir;
  });
  const PAGE=20, pages=Math.max(1,Math.ceil(rows.length/PAGE));
  if(__regPage>=pages) __regPage=pages-1;
  const slice=rows.slice(__regPage*PAGE, __regPage*PAGE+PAGE);
  const arrow=(k)=>__regSort.key===k?(__regSort.asc?' ↑':' ↓'):'';
  $("#view").innerHTML = `
    <div class="toolbar" style="gap:8px;flex-wrap:wrap;margin-bottom:12px">
      <input id="reg-search" placeholder="Search name, user ID or mobile…" value="${esc(__regSearch)}"
        style="flex:1;min-width:220px;padding:9px 12px;border:1px solid var(--border);border-radius:10px;font:inherit"/>
      <span class="muted" style="font-size:12.5px">${rows.length} registered</span>
    </div>
    <div class="card" style="padding:0;overflow-x:auto"><table>
      <thead><tr>
        <th>S.No</th>
        <th style="cursor:pointer" onclick="regSort('name')">Name${arrow('name')}</th>
        <th>User ID</th>
        <th style="cursor:pointer" onclick="regSort('date')">Registration date${arrow('date')}</th>
        <th style="cursor:pointer" onclick="regSort('buy')">Buy status${arrow('buy')}</th>
      </tr></thead>
      <tbody>${slice.length? slice.map((r,i)=>`<tr>
        <td class="muted">${__regPage*PAGE+i+1}</td>
        <td><b>${esc(r.name||'Member')}</b><div class="muted" style="font-size:12px">${esc(r.role||'')}${r.mobile?' · +'+esc(r.mobile):''}</div></td>
        <td>${esc(r.user_id||'—')}</td>
        <td class="muted">${new Date(r.registered_at).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}</td>
        <td><span class="pill ${r.bought?'ok':'grey'}">${r.bought?'Yes':'No'}</span></td>
      </tr>`).join('') : `<tr><td colspan="5" class="muted" style="padding:18px">No registrations match.</td></tr>`}</tbody>
    </table></div>
    ${pages>1?`<div class="toolbar" style="justify-content:center;gap:10px;margin-top:12px">
      <button class="btn grey sm" ${__regPage===0?'disabled':''} onclick="regPage(-1)">‹ Prev</button>
      <span class="muted" style="font-size:12.5px">Page ${__regPage+1} of ${pages}</span>
      <button class="btn grey sm" ${__regPage>=pages-1?'disabled':''} onclick="regPage(1)">Next ›</button>
    </div>`:''}`;
  const inp=$("#reg-search");
  inp.addEventListener("input",()=>{__regSearch=inp.value;__regPage=0;const pos=inp.selectionStart;renderRegistrations().then(()=>{const n=$("#reg-search");n.focus();n.setSelectionRange(pos,pos);});});
}
window.regSort=(k)=>{ if(__regSort.key===k)__regSort.asc=!__regSort.asc; else __regSort={key:k,asc:k==='name'}; __regPage=0; renderRegistrations(); };
window.regPage=(d)=>{ __regPage+=d; renderRegistrations(); };

// ───────── community (posts / contact log / reports) ─────────
async function renderCommunity(){
  const sub = window.__commSub || "posts";
  const chip=(v,l)=>`<button class="btn ${sub===v?'':'grey'} sm" onclick="commSub('${v}')">${l}</button>`;
  let html = `<div class="toolbar" style="gap:6px;flex-wrap:wrap;margin-bottom:12px">${chip('posts','Posts')}${chip('contacts','Contact log')}${chip('reports','Reports')}</div>`;
  if(sub==='posts'){
    const { data } = await sb.from("community_posts")
      .select("*, author:profiles!community_posts_author_id_fkey(full_name,member_code,mobile)")
      .order("created_at",{ascending:false}).limit(100);
    const rows = data||[];
    html += rows.length ? rows.map(p=>{
      const st={published:'ok',hidden:'warn',removed:'red'}[p.status]||'grey';
      const media=(p.media||[]).map((m,i)=>`<a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.type)}${m.name?` (${esc(m.name)})`:''}</a>`).join(" · ");
      const links=(p.links||[]).map(l=>`<a href="${esc(l)}" target="_blank" rel="noopener">${esc(l)}</a>`).join(" · ");
      return `<div class="card" style="padding:14px;margin-bottom:10px">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <b>${esc(p.author?.full_name||"Member")}</b>
          <span class="muted" style="font-size:12px">${esc(p.author?.member_code||"")} ${p.author?.mobile?`· +${esc(p.author.mobile)}`:""} · ${new Date(p.created_at).toLocaleString()}</span>
          <span class="pill ${st}">${esc(p.status)}</span>
          ${p.masked?`<span class="pill warn">contacts masked</span>`:""}
        </div>
        ${p.body?`<div style="font-size:13px;margin-top:8px;white-space:pre-wrap">${esc(p.body)}</div>`:""}
        ${media?`<div class="muted" style="font-size:12px;margin-top:6px">📎 ${media}</div>`:""}
        ${links?`<div class="muted" style="font-size:12px;margin-top:4px">🔗 ${links}</div>`:""}
        <div class="toolbar" style="margin-top:10px;justify-content:flex-end">
          ${p.status!=='hidden'?`<button class="btn grey sm" onclick="commStatus('${p.id}','hidden')">Hide</button>`:""}
          ${p.status!=='published'?`<button class="btn sm" onclick="commStatus('${p.id}','published')">Restore</button>`:""}
          ${p.status!=='removed'?`<button class="btn ghost sm" onclick="commStatus('${p.id}','removed')">Remove</button>`:""}
        </div></div>`;
    }).join("") : `<div class="empty card">No community posts yet.</div>`;
  } else if(sub==='contacts'){
    const { data } = await sb.from("community_contact_log")
      .select("*, author:profiles!community_contact_log_author_id_fkey(full_name,member_code,mobile)")
      .order("created_at",{ascending:false}).limit(300);
    const rows = data||[];
    html += `<div class="muted" style="font-size:12px;margin-bottom:8px">Every email / phone number members typed in community posts & comments — shown to the public as “[contact hidden]”, recorded here verbatim.</div>`;
    html += rows.length ? `<div class="card" style="padding:0">${rows.map(r=>`
      <div style="display:flex;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--border)">
        <span class="pill ${r.kind==='email'?'ok':'warn'}">${esc(r.kind)}</span>
        <b style="font-size:13px">${esc(r.value)}</b>
        <span class="muted" style="font-size:12px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc((r.raw_text||"").slice(0,120))}</span>
        <span class="muted" style="font-size:11.5px;white-space:nowrap">${esc(r.author?.full_name||"")} ${esc(r.author?.member_code||"")} · ${new Date(r.created_at).toLocaleString()}</span>
      </div>`).join("")}</div>` : `<div class="empty card">No contacts recorded yet.</div>`;
  } else {
    const { data } = await sb.from("community_reports")
      .select("*, reporter:profiles!community_reports_reporter_id_fkey(full_name,member_code), post:community_posts!community_reports_post_id_fkey(body,status)")
      .order("created_at",{ascending:false}).limit(100);
    const rows = data||[];
    html += rows.length ? rows.map(r=>`<div class="card" style="padding:14px;margin-bottom:10px">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <span class="pill ${r.status==='open'?'warn':'ok'}">${esc(r.status)}</span>
          <b style="font-size:13px">${esc(r.reason||"report")}</b>
          <span class="muted" style="font-size:12px">by ${esc(r.reporter?.full_name||"")} · ${new Date(r.created_at).toLocaleString()}</span>
        </div>
        ${r.post?.body?`<div class="muted" style="font-size:12.5px;margin-top:6px">Post: ${esc(r.post.body.slice(0,160))} <span class="pill grey">${esc(r.post.status)}</span></div>`:""}
        <div class="toolbar" style="margin-top:10px;justify-content:flex-end">
          ${r.post_id?`<button class="btn grey sm" onclick="commStatus('${r.post_id}','hidden')">Hide post</button>`:""}
          ${r.status==='open'?`<button class="btn sm" onclick="commResolve('${r.id}')">Mark resolved</button>`:""}
        </div></div>`).join("") : `<div class="empty card">No reports.</div>`;
  }
  $("#view").innerHTML = html;
}
window.commSub = (v)=>{ window.__commSub=v; renderCommunity(); };
window.commStatus = async (id,status)=>{
  const { error } = await sb.rpc("admin_set_community_status",{p_id:id,p_status:status});
  if(error) return toast(error.message); toast("Post "+status); renderCommunity(); refreshBadges();
};
window.commResolve = async (id)=>{
  const { error } = await sb.from("community_reports").update({status:'resolved'}).eq("id",id);
  if(error) return toast(error.message); toast("Report resolved"); renderCommunity(); refreshBadges();
};

// ───────── site visits ─────────
async function renderVisits(){
  const status = window.__visitFilter || "";
  let q = sb.from("site_visits").select("*, buyer:profiles!site_visits_buyer_id_fkey(member_code,full_name,mobile), property:properties!site_visits_property_id_fkey(title,locality,city)").order("created_at",{ascending:false}).limit(300);
  if(status) q = q.eq("status", status);
  const { data } = await q; const rows=data||[];
  const chip=(v,l)=>`<button class="btn ${((window.__visitFilter||'')===v)?'':'grey'} sm" onclick="visitFilter('${v}')">${l}</button>`;
  $("#view").innerHTML = `<div class="toolbar" style="gap:6px;flex-wrap:wrap">${chip('','All')}${chip('requested','Requested')}${chip('confirmed','Confirmed')}${chip('completed','Completed')}${chip('cancelled','Cancelled')}</div>
    ${rows.length? `<table><thead><tr><th>Property</th><th>Buyer</th><th>Preferred</th><th>Status</th><th></th></tr></thead><tbody>
      ${rows.map(v=>{const st={requested:'warn',confirmed:'',completed:'ok',cancelled:'red'}[v.status]||'grey';
      return `<tr><td><b>${esc(v.property?.title||'Property')}</b><div class="muted" style="font-size:12px">${esc([v.property?.locality,v.property?.city].filter(Boolean).join(', '))}</div></td>
      <td>${esc(v.buyer?.full_name||'—')}<div class="muted" style="font-size:12px">${esc(v.buyer?.member_code||'')}${v.buyer?.mobile?' · +'+esc(v.buyer.mobile):''}</div></td>
      <td class="muted">${v.preferred_date?esc(v.preferred_date):'—'}</td>
      <td><span class="pill ${st}">${esc(v.status)}</span></td>
      <td style="text-align:right">${(v.status!=='confirmed'&&v.status!=='completed'&&v.status!=='cancelled')?`<button class="btn sm" onclick="setVisit('${v.id}','confirmed')">Confirm</button> `:''}${v.status!=='completed'&&v.status!=='cancelled'?`<button class="btn gold sm" onclick="setVisit('${v.id}','completed')">Complete</button> `:''}${v.status!=='cancelled'?`<button class="btn ghost sm" onclick="setVisit('${v.id}','cancelled')">Cancel</button>`:''}${v.status==='cancelled'?`<button class="btn sm" onclick="setVisit('${v.id}','requested')">Reopen</button> <button class="btn gold sm" onclick="setVisit('${v.id}','confirmed')">Confirm</button>`:''}${v.status==='completed'?` <button class="btn grey sm" onclick="setVisit('${v.id}','confirmed')">Revert to Confirmed</button>`:''}</td></tr>`;}).join('')}</tbody></table>`
      : `<div class="empty card">No site visits.</div>`}`;
}
window.visitFilter=(v)=>{window.__visitFilter=v;renderVisits();};
window.setVisit=async(id,status)=>{
  // a visit leaving 'cancelled' sheds its old cancellation note (bug 28-07)
  const patch={status}; if(status!=='cancelled') patch.cancel_reason=null;
  const {error}=await sb.from('site_visits').update(patch).eq('id',id);
  if(error) return toast(error.message); toast('Visit '+status); refreshBadges(); renderVisits();};

// ───────── leads ─────────
async function renderLeads(){
  const status=window.__leadFilter||'';
  let q=sb.from('leads').select('*, buyer:profiles!leads_buyer_id_fkey(member_code,full_name,mobile), promoter:profiles!leads_promoter_id_fkey(member_code), property:properties!leads_property_id_fkey(title,city)').order('created_at',{ascending:false}).limit(300);
  if(status) q=q.eq('status',status);
  const {data}=await q; const rows=data||[];
  const chip=(v,l)=>`<button class="btn ${((window.__leadFilter||'')===v)?'':'grey'} sm" onclick="leadFilter('${v}')">${l}</button>`;
  $("#view").innerHTML=`<div class="toolbar" style="gap:6px;flex-wrap:wrap">${chip('','All')}${chip('new','New')}${chip('contacted','Contacted')}${chip('qualified','Qualified')}${chip('converted','Converted')}${chip('lost','Lost')}</div>
    ${rows.length? `<table><thead><tr><th>Buyer</th><th>Source</th><th>Property</th><th>Promoter</th><th>Status</th><th>Set</th></tr></thead><tbody>
      ${rows.map(l=>{const st={new:'warn',contacted:'',qualified:'',converted:'ok',lost:'red'}[l.status]||'grey';
      return `<tr><td><b>${esc(l.buyer?.full_name||(l.source==='vcard'?'V-Card visitor':'—'))}</b><div class="muted" style="font-size:12px">${esc(l.buyer?.member_code||'')}${l.buyer?.mobile?' · +'+esc(l.buyer.mobile):''}</div>${l.notes?`<div class="muted" style="font-size:11px;max-width:280px;white-space:pre-wrap">${esc(l.notes)}</div>`:''}</td>
      <td class="muted">${esc((l.source||'').replace(/_/g,' '))}</td>
      <td class="muted">${esc(l.property?.title||'—')}</td>
      <td class="muted">${esc(l.promoter?.member_code||'—')}</td>
      <td><span class="pill ${st}">${esc(l.status)}</span></td>
      <td><select onchange="setLead('${l.id}',this.value)" style="width:auto;padding:6px 8px"><option value="">Set…</option><option>contacted</option><option>qualified</option><option>converted</option><option>lost</option></select></td></tr>`;}).join('')}</tbody></table>`
      : `<div class="empty card">No leads.</div>`}`;
}
window.leadFilter=(v)=>{window.__leadFilter=v;renderLeads();};
window.setLead=async(id,status)=>{if(!status)return; const {error}=await sb.from('leads').update({status}).eq('id',id); if(error) return toast(error.message); toast('Lead '+status); renderLeads();};

// ───────── WhatsApp invites (referral download-link requests from /welcome) ─────────
async function renderInvites(){
  const status=window.__invFilter||'';
  let q=sb.from('referral_wa_requests').select('*, referrer:profiles!referral_wa_requests_referrer_id_fkey(member_code,full_name,mobile)').order('created_at',{ascending:false}).limit(300);
  if(status) q=q.eq('status',status);
  const {data,error}=await q; const rows=data||[];
  if(error){ $("#view").innerHTML=`<div class="empty card">${esc(error.message)}</div>`; return; }
  const chip=(v,l)=>`<button class="btn ${((window.__invFilter||'')===v)?'':'grey'} sm" onclick="invFilter('${v}')">${l}</button>`;
  const when=(t)=>{ try{ return new Date(t).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }catch(e){ return t||'—'; } };
  $("#view").innerHTML=`<div class="card" style="padding:14px 18px;margin-bottom:14px;"><p class="muted" style="font-size:13px;margin:0;">
      Each row is someone who tapped <b>“Get the app on WhatsApp”</b> on the share page — with the invite code they carried.
      Match it to the WhatsApp message on the desk phone, send the download link, then <b>Accept</b> to credit the referrer's Downloads stat.</p></div>
    <div class="toolbar" style="gap:6px;flex-wrap:wrap">${chip('','All')}${chip('new','New')}${chip('accepted','Accepted')}${chip('dismissed','Dismissed')}</div>
    ${rows.length? `<table><thead><tr><th>Invite code</th><th>Referred by</th><th>Source</th><th>When</th><th>Status</th><th></th></tr></thead><tbody>
      ${rows.map(r=>{const st={new:'warn',accepted:'ok',dismissed:'grey'}[r.status]||'grey';
      return `<tr><td><b>${esc(r.code||'—')}</b></td>
      <td>${esc(r.referrer?.full_name||'—')}<div class="muted" style="font-size:12px">${esc(r.referrer?.member_code||'')}${r.referrer?.mobile?' · +'+esc(r.referrer.mobile):''}</div></td>
      <td class="muted">${esc(r.source)}</td>
      <td class="muted">${when(r.created_at)}</td>
      <td><span class="pill ${st}">${esc(r.status)}</span></td>
      <td style="text-align:right">${r.status==='new'?`<button class="btn sm" onclick="reviewInvite('${r.id}','accepted')">Accept</button> <button class="btn ghost sm" onclick="reviewInvite('${r.id}','dismissed')">Dismiss</button>`:''}</td></tr>`;}).join('')}</tbody></table>`
      : `<div class="empty card">No WhatsApp invite requests${status?` in “${esc(status)}”`:''} yet.</div>`}`;
}
window.invFilter=(v)=>{window.__invFilter=v;renderInvites();};
window.reviewInvite=async(id,decision)=>{
  const {error}=await sb.rpc('admin_review_wa_request',{p_id:id,p_decision:decision});
  if(error) return toast(error.message);
  toast(decision==='accepted'?'Invite accepted — referrer credited':'Invite dismissed');
  refreshBadges(); renderInvites();
};

// ───────── share & brochures (0053: branded share pages + personalized PDFs) ─────────
async function renderShareSettings(){
  const [{data:cfgRow},{data:props},{data:dls}] = await Promise.all([
    sb.from('site_config').select('value').eq('key','share').maybeSingle(),
    sb.from('properties').select('id,title,project_phase,brochure_url').neq('status','archived').order('created_at',{ascending:false}),
    sb.from('brochure_downloads').select('created_at,channel,ref_code,promoter:profiles!brochure_downloads_promoter_id_fkey(full_name,partner_code),property:properties(title)').order('created_at',{ascending:false}).limit(25),
  ]);
  const cfg=(cfgRow&&cfgRow.value)||{};
  const base=cfg.site_base||'https://merry-begonia-4c3cd1.netlify.app';
  const f=(id,label,val,ph)=>`<label style="display:block;font-size:12px;color:var(--muted);margin:10px 0 4px">${label}</label><input id="${id}" value="${esc(val||'')}" placeholder="${ph||''}" style="width:100%">`;
  $("#view").innerHTML=`
  <div class="card" style="padding:18px;margin-bottom:14px;">
    <b>Share settings</b>
    <p class="muted" style="font-size:13px;margin:6px 0 0;">These texts appear on every branded share page (/s/…) and on each promoter-personalized brochure (/b/…). Change them here — no code deploy needed.</p>
    ${f('sc-badge','Verified partner badge label',cfg.badge_label,'Verified Jamin Bazaar Partner')}
    ${f('sc-brand','Brand name',cfg.brand_name,'Jamin Properties')}
    ${f('sc-tag','Tagline',cfg.tagline,'Signature for Fortune')}
    ${f('sc-desk','Helpdesk phone',cfg.desk_phone,'+919384818895')}
    <div style="margin-top:12px"><button class="btn" onclick="saveShareCfg()">Save settings</button></div>
  </div>
  <div class="card" style="padding:18px;margin-bottom:14px;">
    <b>Project share links</b>
    <p class="muted" style="font-size:13px;margin:6px 0 10px;">Copy-ready branded links. Append <b>?ref=JA-REF-…</b> (or a JA-P code) to attribute shares to a promoter — their personalized brochure and contact card are generated automatically.</p>
    ${(props||[]).map(p=>`<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap">
        <div style="flex:1;min-width:180px"><b style="font-size:13px">${esc(p.title)}</b><div class="muted" style="font-size:11px">${esc(p.project_phase||'')}${p.brochure_url?' · brochure ✓':' · no brochure'}</div></div>
        <button class="btn ghost sm" onclick="copyTxt('${base}/s/${p.id}')">Copy share link</button>
        ${p.brochure_url?`<button class="btn ghost sm" onclick="copyTxt('${base}/b/${p.id}')">Copy brochure link</button>`:''}
      </div>`).join('')}
  </div>
  <div class="card" style="padding:18px;">
    <b>Recent brochure downloads</b>
    ${(dls&&dls.length)?`<table style="margin-top:10px"><thead><tr><th>When</th><th>Project</th><th>Promoter</th><th>Ref</th><th>Channel</th></tr></thead><tbody>
      ${dls.map(r=>`<tr><td class="muted">${new Date(r.created_at).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</td>
        <td>${esc(r.property?.title||'—')}</td><td>${esc(r.promoter?.full_name||'—')}${r.promoter?.partner_code?` <span class="muted">· ${esc(r.promoter.partner_code)}</span>`:''}</td>
        <td class="muted">${esc(r.ref_code||'—')}</td><td class="muted">${esc(r.channel||'app')}</td></tr>`).join('')}</tbody></table>`
      :`<p class="muted" style="font-size:13px;margin:8px 0 0;">No downloads logged yet.</p>`}
  </div>`;
}
window.copyTxt=async(t)=>{ try{ await navigator.clipboard.writeText(t); toast('Copied'); }catch(e){ prompt('Copy:',t); } };
window.saveShareCfg=async()=>{
  const value={
    badge_label:$("#sc-badge").value.trim()||'Verified Jamin Bazaar Partner',
    brand_name:$("#sc-brand").value.trim()||'Jamin Properties',
    tagline:$("#sc-tag").value.trim()||'Signature for Fortune',
    desk_phone:$("#sc-desk").value.trim()||'+919384818895',
    site_base:'https://merry-begonia-4c3cd1.netlify.app',
  };
  const {error}=await sb.from('site_config').upsert({key:'share',value,updated_at:new Date().toISOString()});
  if(error) return toast(error.message);
  toast('Share settings saved — live immediately');
};
</script>
